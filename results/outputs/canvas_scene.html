<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lighthouse at Night</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #050510; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Stars ----------
  const stars = [];
  for (let i = 0; i < 160; i++) {
    stars.push({
      x: Math.random(), y: Math.random() * 0.55,
      r: Math.random() * 1.3 + 0.3,
      phase: Math.random() * Math.PI * 2,
      speed: 0.5 + Math.random() * 1.5
    });
  }

  // ---------- Clouds ----------
  const clouds = [];
  for (let i = 0; i < 7; i++) {
    clouds.push({
      x: Math.random(), y: 0.06 + Math.random() * 0.3,
      s: 0.5 + Math.random() * 0.9,
      v: 0.004 + Math.random() * 0.012,
      a: 0.05 + Math.random() * 0.1
    });
  }

  // ---------- Sea state ----------
  const waves = [];
  for (let i = 0; i < 6; i++) {
    waves.push({
      amp: 6 + i * 3,
      len: 180 + i * 90,
      speed: 20 + i * 8,
      phase: Math.random() * Math.PI * 2
    });
  }

  // Lighthouse position (relative anchors)
  const LH = { x: 0.72, cliffTop: 0.62 };
  const beamLength = () => Math.max(W, H) * 1.1;

  let last = performance.now();
  let time = 0;

  function drawStars(t) {
    for (const s of stars) {
      const tw = 0.35 + 0.65 * Math.abs(Math.sin(t * s.speed + s.phase));
      const alpha = tw * (1 - s.y * 0.7);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#e8ecff';
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fill();
      if (s.r > 1) {
        ctx.globalAlpha = alpha * 0.4;
        ctx.beginPath();
        ctx.arc(s.x * W, s.y * H, s.r * 2.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawClouds() {
    for (const c of clouds) {
      c.x += c.v * (1 / 60);
      if (c.x > 1.3) c.x = -0.35;
      const cx = c.x * W, cy = c.y * H, s = c.s * (H * 0.045);
      ctx.globalAlpha = c.a;
      ctx.fillStyle = '#3a3f5c';
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const ang = (i / 5) * Math.PI * 2;
        ctx.arc(cx + Math.cos(ang) * s * 1.6, cy + Math.sin(ang) * s * 0.5, s * (0.7 + (i % 2) * 0.35), 0, Math.PI * 2);
      }
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#070716');
    g.addColorStop(0.55, '#101426');
    g.addColorStop(1, '#1a2138');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawMoon() {
    const mx = W * 0.16, my = H * 0.14, r = H * 0.035;
    ctx.save();
    const g = ctx.createRadialGradient(mx, my, r * 0.5, mx, my, r * 4);
    g.addColorStop(0, 'rgba(230,235,255,0.35)');
    g.addColorStop(1, 'rgba(230,235,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(mx, my, r * 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e6eaff';
    ctx.beginPath(); ctx.arc(mx, my, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c9cfe8';
    ctx.beginPath(); ctx.arc(mx - r * 0.35, my - r * 0.2, r * 0.22, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(mx + r * 0.3, my + r * 0.3, r * 0.15, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawSea(t) {
    const seaTop = H * 0.78;
    const g = ctx.createLinearGradient(0, seaTop, 0, H);
    g.addColorStop(0, '#0d1626');
    g.addColorStop(1, '#050a14');
    ctx.fillStyle = g;
    ctx.fillRect(0, seaTop, W, H - seaTop);

    // moon reflection
    ctx.save();
    ctx.globalAlpha = 0.08;
    ctx.fillStyle = '#cfd8ff';
    for (let i = 0; i < 14; i++) {
      const y = seaTop + 8 + i * ((H - seaTop - 16) / 14);
      const wob = Math.sin(t * 1.5 + i) * 14;
      ctx.fillRect(W * 0.16 - 22 + wob, y, 44, 2.5);
    }
    ctx.restore();

    // wave crests
    for (let wi = 0; wi < waves.length; wi++) {
      const wv = waves[wi];
      ctx.beginPath();
      for (let x = 0; x <= W; x += 6) {
        const y = seaTop + (wi + 1) * ((H - seaTop) / (waves.length + 1)) * 0.9
          + Math.sin((x / W * Math.PI * 2 * 3) + t * 0.8 + wv.phase) * wv.amp * 0.4;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = 'rgba(140,170,220,0.14)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // foam highlights near shore
    ctx.strokeStyle = 'rgba(200,220,255,0.10)';
    ctx.lineWidth = 2;
    for (let k = 0; k < 3; k++) {
      ctx.beginPath();
      for (let x = 0; x <= W; x += 8) {
        const y = H - 20 - k * 18 + Math.sin(x * 0.02 + t * (1.2 + k * 0.3)) * 5;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }

  function drawCliff() {
    const baseY = H * 0.78;
    const cx = LH.x * W;
    ctx.beginPath();
    ctx.moveTo(cx - W * 0.16, baseY);
    ctx.quadraticCurveTo(cx - W * 0.10, baseY - H * 0.06, cx - W * 0.05, baseY - H * 0.075);
    ctx.lineTo(cx + W * 0.045, baseY - H * 0.095);
    ctx.quadraticCurveTo(cx + W * 0.10, baseY - H * 0.05, cx + W * 0.15, baseY);
    ctx.lineTo(cx + W * 0.16, H);
    ctx.lineTo(cx - W * 0.16, H);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, baseY - H * 0.1, 0, H);
    g.addColorStop(0, '#232433');
    g.addColorStop(1, '#0e0f18');
    ctx.fillStyle = g;
    ctx.fill();

    // rock texture
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      ctx.beginPath();
      const sx = cx - W * 0.12 + i * W * 0.03;
      ctx.moveTo(sx, baseY - H * 0.05 - (i % 3) * H * 0.01);
      ctx.lineTo(sx + W * 0.01, baseY + (H - baseY) * (0.2 + (i % 4) * 0.2));
      ctx.stroke();
    }
  }

  function drawLighthouse(t) {
    const cx = LH.x * W;
    const baseY = H * 0.78 - H * 0.085;
    const lhH = H * 0.34;
    const topY = baseY - lhH;
    const halfW = lhH * 0.13;

    // tower (tapered)
    ctx.beginPath();
    ctx.moveTo(cx - halfW * 1.4, baseY);
    ctx.lineTo(cx - halfW * 0.55, topY);
    ctx.lineTo(cx + halfW * 0.55, topY);
    ctx.lineTo(cx + halfW * 1.4, baseY);
    ctx.closePath();
    const g = ctx.createLinearGradient(cx - halfW, 0, cx + halfW, 0);
    g.addColorStop(0, '#2b2f42');
    g.addColorStop(0.5, '#41465e');
    g.addColorStop(1, '#22242f');
    ctx.fillStyle = g;
    ctx.fill();

    // bands
    ctx.save();
    ctx.clip();
    ctx.fillStyle = 'rgba(20,22,32,0.55)';
    const bandH = lhH / 5;
    for (let i = 0; i < 5; i += 2) {
      ctx.fillRect(cx - halfW * 1.5, topY + i * bandH, halfW * 3, bandH);
    }
    ctx.restore();

    // gallery / lamp room
    const lrW = halfW * 0.85, lrH = lhH * 0.14;
    const lrY = topY - lrH;
    ctx.fillStyle = '#2e3348';
    ctx.fillRect(cx - lrW, lrY, lrW * 2, lrH);

    // glass panes (glow when beam faces viewer)
    const beamAngle = t * 0.7 % (Math.PI * 2);
    const facing = Math.max(0, Math.cos(beamAngle - Math.PI / 2)); // brightness of lamp
    const lampGlow = 0.5 + 0.5 * Math.sin(t * 0.7 * 2);

    ctx.fillStyle = `rgba(255,230,150,${0.35 + 0.4 * lampGlow})`;
    ctx.fillRect(cx - lrW + 3, lrY + 3, lrW * 2 - 6, lrH - 6);
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 2;
    ctx.strokeRect(cx - lrW + 3, lrY + 3, lrW * 2 - 6, lrH - 6);

    // roof
    ctx.beginPath();
    ctx.moveTo(cx - lrW - 4, lrY);
    ctx.lineTo(cx, lrY - lrH * 0.9);
    ctx.lineTo(cx + lrW + 4, lrY);
    ctx.closePath();
    ctx.fillStyle = '#1c1e2a';
    ctx.fill();

    // railing posts
    ctx.strokeStyle = '#3a3f55';
    ctx.lineWidth = 2;
    for (let i = -3; i <= 3; i++) {
      ctx.beginPath();
      ctx.moveTo(cx + i * lrW / 3.2, lrY);
      ctx.lineTo(cx + i * lrW / 3.2, lrY - lrH * 0.35);
      ctx.stroke();
    }

    // door
    ctx.fillStyle = '#15161f';
    ctx.beginPath();
    ctx.moveTo(cx - halfW * 0.35, baseY);
    ctx.lineTo(cx - halfW * 0.35, baseY - lhH * 0.09);
    ctx.quadraticCurveTo(cx, baseY - lhH * 0.13, cx + halfW * 0.35, baseY - lhH * 0.09);
    ctx.lineTo(cx + halfW * 0.35, baseY);
    ctx.closePath();
    ctx.fill();
  }

  function drawBeam(t) {
    const cx = LH.x * W;
    const baseY = H * 0.78 - H * 0.085;
    const lhH = H * 0.34;
    const lrY = baseY - lhH - lhH * 0.14;
    const lampY = lrY + lhH * 0.07;
    const ang = t * 0.7 % (Math.PI * 2);
    const len = beamLength();

    // two opposite beams
    for (const dir of [0, Math.PI]) {
      const a = ang + dir;
      const ex = cx + Math.cos(a) * len;
      const ey = lampY + Math.sin(a) * len;
      const g = ctx.createLinearGradient(cx, lampY, ex, ey);
      g.addColorStop(0, 'rgba(255,240,180,0.30)');
      g.addColorStop(0.5, 'rgba(255,240,180,0.10)');
      g.addColorStop(1, 'rgba(255,240,180,0)');
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(cx, lampY);
      const spread = 0.09;
      ctx.lineTo(cx + Math.cos(a - spread) * len, lampY + Math.sin(a - spread) * len);
      ctx.lineTo(cx + Math.cos(a + spread) * len, lampY + Math.sin(a + spread) * len);
      ctx.closePath();
      ctx.fillStyle = g;
      ctx.fill();
      ctx.restore();
    }

    // lamp flare
    const flare = ctx.createRadialGradient(cx, lampY, 2, cx, lampY, lhH * 0.25);
    flare.addColorStop(0, 'rgba(255,250,220,0.9)');
    flare.addColorStop(0.3, 'rgba(255,230,150,0.35)');
    flare.addColorStop(1, 'rgba(255,230,150,0)');
    ctx.fillStyle = flare;
    ctx.beginPath();
    ctx.arc(cx, lampY, lhH * 0.25, 0, Math.PI * 2);
    ctx.fill();
  }

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    time += dt;

    drawSky();
    drawStars(time);
    drawMoon();
    drawClouds();
    drawSea(time);
    drawCliff();
    drawBeam(time);
    drawLighthouse(time);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
