<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Solar System</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 5000);
camera.position.set(0, 40, 90);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

// ---------- Starfield ----------
const starGeo = new THREE.BufferGeometry();
const starPos = [];
for (let i = 0; i < 3000; i++) {
  const r = 400 + Math.random() * 1200;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  starPos.push(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
}
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.5, sizeAttenuation: true })));

// ---------- Sun ----------
const sun = new THREE.Mesh(
  new THREE.SphereGeometry(8, 48, 48),
  new THREE.MeshBasicMaterial({ color: 0xffcc33 })
);
scene.add(sun);

const glow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: (() => {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
    grad.addColorStop(0, 'rgba(255,200,80,0.9)');
    grad.addColorStop(0.4, 'rgba(255,140,40,0.35)');
    grad.addColorStop(1, 'rgba(255,100,0,0)');
    g.fillStyle = grad; g.fillRect(0, 0, 256, 256);
    return new THREE.CanvasTexture(c);
  })(),
  blending: THREE.AdditiveBlending, depthWrite: false
}));
glow.scale.set(60, 60, 1);
sun.add(glow);

scene.add(new THREE.PointLight(0xffffff, 2000, 0, 2));
scene.add(new THREE.AmbientLight(0x334466, 0.4));

// ---------- Planets ----------
const planetDefs = [
  { name: 'Mercury', color: 0x9c9c9c, size: 1.2, dist: 16, speed: 0.9 },
  { name: 'Venus',   color: 0xe8b56a, size: 1.9, dist: 24, speed: 0.7 },
  { name: 'Earth',   color: 0x3a7bd5, size: 2.2, dist: 34, speed: 0.5, moon: true },
  { name: 'Saturn',  color: 0xd8b56a, size: 3.2, dist: 52, speed: 0.3, ring: true }
];

const planets = [];
for (const def of planetDefs) {
  const pivot = new THREE.Object3D();           // orbit pivot around sun
  const holder = new THREE.Object3D();          // planet position on orbit
  holder.position.x = def.dist;
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(def.size, 32, 32),
    new THREE.MeshStandardMaterial({ color: def.color, roughness: 0.7, metalness: 0.1 })
  );
  holder.add(mesh);
  pivot.add(holder);
  scene.add(pivot);

  // Orbit line
  const pts = [];
  for (let i = 0; i <= 128; i++) {
    const a = (i / 128) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * def.dist, 0, Math.sin(a) * def.dist));
  }
  scene.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0x555577, transparent: true, opacity: 0.5 })
  ));

  // Ring
  if (def.ring) {
    const ringGeo = new THREE.RingGeometry(def.size * 1.4, def.size * 2.3, 64);
    const pos = ringGeo.attributes.position;
    const v3 = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v3.fromBufferAttribute(pos, i);
      ringGeo.attributes.uv.setXY(i, (v3.length() - def.size * 1.4) / (def.size * 0.9), 0);
    }
    const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
      color: 0xc9a96a, side: THREE.DoubleSide, transparent: true, opacity: 0.85
    }));
    ring.rotation.x = Math.PI / 2.3;
    mesh.add(ring);
  }

  // Moon
  let moonPivot = null;
  if (def.moon) {
    moonPivot = new THREE.Object3D();
    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(0.6, 24, 24),
      new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.9 })
    );
    moon.position.x = 4;
    moonPivot.add(moon);
    holder.add(moonPivot);
  }

  planets.push({ pivot, mesh, speed: def.speed, moonPivot });
}

// ---------- Hand-rolled orbit controls ----------
let theta = 0.6, phi = 0.35, radius = 110, dragging = false, px = 0, py = 0;
const el = renderer.domElement;
el.addEventListener('pointerdown', e => { dragging = true; px = e.clientX; py = e.clientY; });
addEventListener('pointerup', () => dragging = false);
addEventListener('pointermove', e => {
  if (!dragging) return;
  theta -= (e.clientX - px) * 0.005;
  phi = Math.min(1.4, Math.max(-1.4, phi + (e.clientY - py) * 0.005));
  px = e.clientX; py = e.clientY;
});
addEventListener('wheel', e => radius = Math.min(400, Math.max(30, radius + e.deltaY * 0.1)));

// ---------- Loop ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  for (const p of planets) {
    p.pivot.rotation.y = t * p.speed * 0.4;
    p.mesh.rotation.y = t * 0.8;
    if (p.moonPivot) p.moonPivot.rotation.y = t * 1.5;
  }
  sun.rotation.y = t * 0.1;

  const sp = Math.cos(phi);
  camera.position.set(
    radius * sp * Math.cos(theta),
    radius * Math.sin(phi),
    radius * sp * Math.sin(theta)
  );
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
